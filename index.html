<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2Gold x45 - Interlude Custom Server</title>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --bg-card: #131722;
            --accent-gold: #c5a880;
            --accent-gold-glow: rgba(197, 168, 128, 0.3);
            --text-light: #e2e8f0;
            --text-muted: #8a94a6;
            --online-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cinzel', 'Segoe UI', serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-dark) 70%);
            line-height: 1.6;
        }

        /* Header & Logo */
        header {
            text-align: center;
            padding: 4rem 1rem 2rem 1rem;
            position: relative;
        }

        .server-logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--accent-gold);
            text-shadow: 0 0 20px var(--accent-gold-glow);
            text-transform: uppercase;
        }

        .server-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 2px;
            margin-top: 0.5rem;
        }

        /* Promo Blocks */
        .promo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .promo-card {
            background: linear-gradient(135deg, #1e2330 0%, #131722 100%);
            border: 1px solid rgba(197, 168, 128, 0.2);
            padding: 2rem 1rem;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .promo-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-gold-glow);
        }

        .promo-card h3 {
            color: var(--accent-gold);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Navigation Bar */
        nav {
            background: rgba(19, 23, 34, 0.8);
            border-top: 1px solid rgba(197, 168, 128, 0.1);
            border-bottom: 1px solid rgba(197, 168, 128, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-gold);
        }

        /* Main 3-Column Layout */
        .main-container {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            gap: 2rem;
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        /* Sidebars */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .widget {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .widget-title {
            color: var(--accent-gold);
            font-size: 1.1rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(197, 168, 128, 0.2);
            padding-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        /* Server Status */
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--online-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--online-green);
        }

        .btn-action {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #af9570 0%, #8c734b 100%);
            color: #000;
            text-align: center;
            padding: 0.7rem;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 1rem;
            text-decoration: none;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        /* Central Content Area */
        .content-area {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 2.5rem;
        }

        .badge-beta {
            background-color: #ef4444;
            color: white;
            padding: 0.2rem 0.6rem;
            font-size: 0.8rem;
            border-radius: 4px;
            text-transform: uppercase;
            vertical-align: middle;
            margin-left: 0.5rem;
        }

        .content-area h2 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        .content-area p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .important-box {
            background: rgba(197, 168, 128, 0.05);
            border-left: 4px solid var(--accent-gold);
            padding: 1.2rem;
            margin-top: 2rem;
            border-radius: 0 8px 8px 0;
        }

        .important-box h4 {
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        /* Info Features List */
        .info-list {
            list-style: none;
        }

        .info-list li {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .info-list li span {
            color: var(--text-light);
        }

        .rates-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .rate-badge {
            background: rgba(255, 255, 255, 0.03);
            padding: 0.5rem;
            text-align: center;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .rate-badge strong {
            color: var(--accent-gold);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem;
            margin-top: 4rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                order: 2;
            }
            .content-area {
                order: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Server Logo -->
    <header>
        <div class="server-logo">L2Gold</div>
        <div class="server-subtitle">The Legacy Reborn • Interlude Custom Chronicle</div>
    </header>

    <!-- Top Promo Buttons -->
    <section class="promo-grid">
        <a href="#" class="promo-card"><h3>How to connect?</h3></a>
        <a href="#" class="promo-card"><h3>C6 Patch</h3></a>
        <a href="#" class="promo-card"><h3>Clans & Allies</h3></a>
        <a href="#" class="promo-card"><h3>Castles</h3></a>
        <a href="#" class="promo-card"><h3>Heroes</h3></a>
    </section>

    <!-- Main Navigation Bar -->
    <nav>
        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Register Account</a></li>
            <li><a href="#">Login</a></li>
            <li><a href="#">World Info</a></li>
            <li><a href="#">Staff List</a></li>
            <li><a href="#">Rules</a></li>
            <li><a href="#">Live Chat</a></li>
        </ul>
    </nav>

    <!-- Main Content Container -->
    <main class="main-container">
        
        <!-- Left Sidebar (Status & Voting) -->
        <aside class="sidebar">
            <div class="widget">
                <h3 class="widget-title">Server Status</h3>
                <div class="status-row">
                    <span>Gameserver</span>
                    <span class="status-indicator"></span>
                </div>
                <div class="status-row">
                    <span>Authserver</span>
                    <span class="status-indicator"></span>
                </div>
                <button class="btn-action" onclick="location.reload()">Refresh</button>
            </div>

            <div class="widget">
                <h3 class="widget-title">Vote Panel</h3>
