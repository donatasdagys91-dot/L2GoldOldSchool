<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L2Gold x45 - Interlude Custom Server</title>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --bg-card: #131722;
            --accent-gold: #c5a880;
            --accent-gold-glow: rgba(197, 168, 128, 0.3);
            --text-light: #e2e8f0;
            --text-muted: #8a94a6;
            --online-green: #10b981;
            --danger-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cinzel', 'Segoe UI', serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-dark) 70%);
            line-height: 1.6;
        }

        /* Header & Logo */
        header {
            text-align: center;
            padding: 4rem 1rem 2rem 1rem;
            position: relative;
        }

        .server-logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--accent-gold);
            text-shadow: 0 0 20px var(--accent-gold-glow);
            text-transform: uppercase;
        }

        .server-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 2px;
            margin-top: 0.5rem;
        }

        /* Top Promo Grid */
        .promo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .promo-card {
            background: linear-gradient(135deg, #1e2330 0%, #131722 100%);
            border: 1px solid rgba(197, 168, 128, 0.2);
            padding: 2rem 1rem;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .promo-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-gold-glow);
        }

        .promo-card h3 {
            color: var(--accent-gold);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Navigation Bar */
        nav {
            background: rgba(19, 23, 34, 0.8);
            border-top: 1px solid rgba(197, 168, 128, 0.1);
            border-bottom: 1px solid rgba(197, 168, 128, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-gold);
        }

        /* Main 3-Column Layout */
        .main-container {
            display: grid;
            grid-template-columns: 260px 1fr 300px;
            gap: 1.5rem;
            max-width: 1300px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        /* Sidebars & Widgets */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .widget {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .widget-title {
            color: var(--accent-gold);
            font-size: 1.1rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(197, 168, 128, 0.2);
            padding-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        /* Status & Server Stats */
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--online-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--online-green);
        }

        .btn-action {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #af9570 0%, #8c734b 100%);
            color: #000;
            text-align: center;
            padding: 0.7rem;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 1rem;
            text-decoration: none;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        /* Ranking Tables (PvP/PK) */
        .rank-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
        }

        .rank-table th {
            color: var(--accent-gold);
            padding-bottom: 0.5rem;
            font-weight: normal;
        }

        .rank-table td {
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
        }

        .rank-table tr:hover td {
            color: var(--text-light);
        }

        .rank-highlight {
            color: var(--accent-gold) !important;
            font-weight: bold;
        }

        /* Central Content Area */
        .content-area {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .badge-beta {
            background-color: var(--danger-red);
            color: white;
            padding: 0.2rem 0.6rem;
            font-size: 0.8rem;
            border-radius: 4px;
            text-transform: uppercase;
            vertical-align: middle;
            margin-left: 0.5rem;
        }

        .content-block h2 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 1rem;
        }

        .content-block p {
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        /* Feature Showcases (Weapons, Armor, Rebirth) */
        .feature-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(197, 168, 128, 0.1);
            padding: 1.2rem;
            border-radius: 6px;
        }

        .feature-item h4 {
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-size: 1.1rem;
        }

        .feature-item ul {
            list-style: square;
            margin-left: 1.2rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .important-box {
            background: rgba(197, 168, 128, 0.05);
            border-left: 4px solid var(--accent-gold);
            padding: 1.2rem;
            border-radius: 0 8px 8px 0;
        }

        /* Info List Features */
        .info-list {
            list-style: none;
        }

        .info-list li {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .info-list li span {
            color: var(--text-light);
        }

        .rates-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .rate-badge {
            background: rgba(255, 255, 255, 0.03);
            padding: 0.5rem;
            text-align: center;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .rate-badge strong {
            color: var(--accent-gold);
        }

        /* Modal (Registration Form Popup) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--accent-gold);
            padding: 2.5rem;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .close-modal:hover {
            color: #fff;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
